name: Events Microservice CI

on:
  push:
    branches:
      - development

  workflow_dispatch:

jobs:
  build:
    name: Test and Build Events
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp -r app artifact/
          cp main.py requirements.txt artifact/
          cp -r migrations seeds artifact/

      - name: Upload events artifact
        uses: actions/upload-artifact@v4
        with:
          name: entradasya-ms-events
          path: artifact/
          retention-days: 7
